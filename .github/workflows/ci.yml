name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bot:
    name: anestbot2 (bot)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: anestbot2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: anestbot2/package-lock.json
      - name: Instalação reprodutível
        run: npm ci
      - name: Testes
        run: npm test
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

  secret-scan:
    name: varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  platform:
    name: apps/api (plataforma)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anest
          POSTGRES_PASSWORD: anest
          POSTGRES_DB: anestbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://anest:anest@localhost:5432/anestbot_test
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Instalação reprodutível
        run: npm ci
      - name: Typecheck (TypeScript estrito)
        run: npm run typecheck
      - name: Testes de integração (Postgres real)
        run: npm test
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
