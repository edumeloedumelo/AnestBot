name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bot:
    name: anestbot2 (bot)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: anestbot2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: anestbot2/package-lock.json
      - name: Instalação reprodutível
        run: npm ci
      - name: Testes
        run: npm test
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

  secret-scan:
    name: varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  platform:
    name: apps/api (plataforma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detecta plataforma
        id: has
        run: echo "api=$([ -f apps/api/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.api == 'yes'
        with: { node-version: 20 }
      - name: Instala, typecheck e testa
        if: steps.has.outputs.api == 'yes'
        working-directory: apps/api
        run: |
          npm ci
          npm run typecheck
          npm test
