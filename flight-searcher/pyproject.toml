[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-searcher"
version = "0.1.0"
description = "Find cheaper flight tickets around the world with expert fare-hunting strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Melo" }]
keywords = ["flights", "travel", "cheap-flights", "amadeus", "fare-search"]

[project.scripts]
flight-searcher = "flight_searcher.cli:main"

[tool.setuptools.packages.find]
include = ["flight_searcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
